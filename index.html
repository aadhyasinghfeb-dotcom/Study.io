<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Timer</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --accent: #00b4d8;
      --accent-glow: #90e0ef;
      --text: #ffffff;
      --text-dim: #a0aec0;
      --btn-bg: #3a506b;
      --success: #06d6a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid var(--btn-bg);
      background-color: rgba(11, 19, 43, 0.6);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }

    /* Timer Display Area */
    .timer-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .timer-circle {
      position: relative;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      border: 6px solid var(--btn-bg);
      border-top-color: var(--accent);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 15px rgba(0, 180, 216, 0.2);
    }

    .block-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--accent);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .time-display {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .block-length {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .sequence-tracker {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .seq-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.1;
    }

    .seq-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--btn-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
    }

    .seq-circle.active {
      border-color: var(--success);
      background-color: rgba(6, 214, 160, 0.2);
      color: var(--success);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background-color: rgba(11, 19, 43, 0.5);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }

    .stat-item .label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .stat-item .val {
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* Primary Actions */
    .action-btns {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--text);
    }

    .btn-primary { background-color: #0077b6; }
    .btn-secondary { background-color: var(--btn-bg); }

    /* Control Panel Card - Fixed Wrap Issues */
    .control-card {
      background-color: rgba(11, 19, 43, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .control-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      line-height: 1.2;
    }

    .control-label strong {
      color: var(--text);
      display: block;
    }

    select {
      background-color: var(--btn-bg);
      color: var(--text);
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 0.8rem;
      border-radius: 6px;
      border: none;
      background-color: var(--btn-bg);
      color: var(--text);
      cursor: pointer;
    }

    .btn-danger { background-color: #e63946; }
    .btn-success { background-color: var(--success); color: #000; font-weight: bold; }

    .btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">⚡ FOCUS STUDY SESSION</div>

    <div class="input-group">
      <input type="text" placeholder="🎯 What are you studying? (e.g. Math)">
    </div>

    <div class="timer-section">
      <div class="timer-circle">
        <div class="block-title" id="block-label">Focus Block 1</div>
        <div class="time-display" id="timer-display">90:00</div>
        <div class="block-length" id="block-sub">90m block length</div>
      </div>

      <div class="sequence-tracker">
        <div class="seq-title">Seque<br>Sched</div>
        <div class="seq-circle active">✓</div>
        <div class="seq-circle active">✓</div>
        <div class="seq-circle"></div>
        <div class="seq-circle"></div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-item">
        <div class="label">Total Time</div>
        <div class="val">300 min</div>
      </div>
      <div class="stat-item">
        <div class="label">Mode</div>
        <div class="val" id="mode-val">Focus</div>
      </div>
      <div class="stat-item">
        <div class="label">Overall</div>
        <div class="val">66.7%</div>
      </div>
    </div>

    <div class="action-btns">
      <button class="btn btn-primary" id="start-btn">❚❚ Pause</button>
      <button class="btn btn-secondary" id="next-btn">⏭ Next Block</button>
    </div>

    <div class="control-card">
      <!-- Session Duration Row -->
      <div class="control-row">
        <div class="control-label">
          <strong>🎯 Session Duration</strong>
          Auto-calculates blocks
        </div>
        <div class="btn-group">
          <select id="duration-select">
            <option value="5">5 Hours</option>
            <option value="3">3 Hours</option>
            <option value="1">1 Hour</option>
          </select>
          <button class="btn-sm" id="apply-btn">🔄 Apply</button>
          <button class="btn-sm btn-danger" id="reset-btn">🧹 Reset</button>
        </div>
      </div>

      <!-- Alerts Row -->
      <div class="control-row">
        <div class="control-label">
          <strong>💻 Desktop Alerts</strong>
          Popup when minimized
        </div>
        <div class="btn-group">
          <button class="btn-sm btn-success" id="notif-btn">✓ Active</button>
          <button class="btn-sm" id="test-notif-btn">🔔 Test</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let timeLeft = 5400; // 90 minutes in seconds
    let timerId = null;
    let isRunning = false;

    const display = document.getElementById('timer-display');
    const startBtn = document.getElementById('start-btn');
    const notifBtn = document.getElementById('notif-btn');
    const testNotifBtn = document.getElementById('test-notif-btn');

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      display.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function triggerNotification(message) {
      if (Notification.permission === 'granted') {
        new Notification("Focus Timer", {
          body: message,
          icon: "https://cdn-icons-png.flaticon.com/512/2693/2693507.png"
        });
      } else {
        alert(message);
      }
    }

    startBtn.addEventListener('click', () => {
      if (isRunning) {
        clearInterval(timerId);
        startBtn.textContent = '▶ Start';
        isRunning = false;
      } else {
        isRunning = true;
        startBtn.textContent = '❚❚ Pause';
        timerId = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
          } else {
            clearInterval(timerId);
            isRunning = false;
            triggerNotification("Time is up! Your focus session has ended.");
            startBtn.textContent = '▶ Start';
          }
        }, 1000);
      }
    });

    notifBtn.addEventListener('click', () => {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            notifBtn.textContent = '✓ Active';
            notifBtn.className = 'btn-sm btn-success';
            triggerNotification("Notifications are working!");
          } else {
            alert("Notification permission was denied in your browser settings.");
          }
        });
      }
    });

    testNotifBtn.addEventListener('click', () => {
      triggerNotification("Test Alert: Your notifications are working perfectly!");
    });

    updateDisplay();
  </script>
</body>
</html>
